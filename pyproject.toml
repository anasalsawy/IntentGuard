[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard"
version = "0.1.0"
description = "Continuous Runtime-Synchronized Deception Detection and Intent-Preservation Supervision for Autonomous AI Agents"
requires-python = ">=3.11"
authors = [{name = "Anas Alsawy"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
